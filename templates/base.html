<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}投資管理{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
</head>
<body>
    <aside class="sidebar">
        <div class="sidebar-brand">
            <i class="bi bi-graph-up-arrow"></i>
            <span>投資管理</span>
        </div>
        <nav class="sidebar-nav">
            <a href="/" class="sidebar-link {% if request.endpoint == 'dashboard' %}active{% endif %}">
                <i class="bi bi-grid-1x2"></i><span>ダッシュボード</span>
            </a>
            <a href="/assets" class="sidebar-link {% if request.endpoint in ('assets', 'holding_detail') %}active{% endif %}">
                <i class="bi bi-wallet2"></i><span>資産一覧</span>
            </a>
            <a href="/dividends" class="sidebar-link {% if request.endpoint == 'dividends' %}active{% endif %}">
                <i class="bi bi-cash-coin"></i><span>配当金</span>
            </a>
            <a href="/realized-gains" class="sidebar-link {% if request.endpoint == 'realized_gains' %}active{% endif %}">
                <i class="bi bi-arrow-left-right"></i><span>実現損益</span>
            </a>
            <a href="/nisa" class="sidebar-link {% if request.endpoint == 'nisa' %}active{% endif %}">
                <i class="bi bi-shield-check"></i><span>NISA管理</span>
            </a>
            <a href="/simulation" class="sidebar-link {% if request.endpoint == 'simulation' %}active{% endif %}">
                <i class="bi bi-calculator"></i><span>複利シミュレーション</span>
            </a>
            <div style="border-top: 1px solid var(--border); margin: 8px 12px;"></div>
            <a href="/family" class="sidebar-link {% if request.endpoint == 'family_list' %}active{% endif %}">
                <i class="bi bi-people"></i><span>家族管理</span>
            </a>
            <a href="/import" class="sidebar-link {% if request.endpoint == 'import_page' %}active{% endif %}">
                <i class="bi bi-arrow-up-circle"></i><span>CSV導入</span>
            </a>
        </nav>
    </aside>

    <main class="main-content">
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert-apple alert-{{ 'error' if category == 'error' else category }}">
                        {{ message }}
                        <button class="alert-close" onclick="this.parentElement.remove()">&times;</button>
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        {% block content %}{% endblock %}
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.2.0/dist/chartjs-plugin-datalabels.min.js"></script>
    <script src="{{ url_for('static', filename='js/charts.js') }}"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
